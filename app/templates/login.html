<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Entrar — Finanças Pessoais</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="center">
  <form class="login" method="get" action="/">
    <h1>💰 Finanças Pessoais</h1>
    <p>Informe o token de acesso.</p>
    <input class="input" type="password" name="token" placeholder="Token de acesso" autofocus required>
    <button class="btn" type="submit">Entrar</button>
    <small>Definido em <code>APP_TOKEN</code> no seu <code>.env</code>.</small>
  </form>
</body>
</html>
